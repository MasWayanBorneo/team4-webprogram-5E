name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cek-website:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validasi HTML
        run: npx --yes html-validate "**/*.html"

      - name: Cek link antarhalaman dan gambar
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: hanya cek link dan file lokal (navbar, gambar, CSS),
          # bukan link ke situs luar yang bisa gagal karena situsnya sedang down.
          args: --offline --no-progress "./**/*.html"
          fail: true
